# fly.toml — app = grok-design
# https://fly.io/docs/reference/configuration/

app = 'grok-design'
primary_region = 'ord'

[build]

[env]
  PORT = '8080'
  HOST = '0.0.0.0'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  # Grok Build agent needs more than 256mb
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
